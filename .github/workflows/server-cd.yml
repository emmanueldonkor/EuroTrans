name: Server CD

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "eurotrans.server/**"
      - ".github/workflows/server-cd.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore eurotrans.server/EuroTrans.sln

      - name: Build
        run: dotnet build eurotrans.server/EuroTrans.sln --configuration Release --no-restore

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef --version "8.*"
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Ensure production DB connection string
        run: |
          if [ -z "$PROD_DB_CONNECTION_STRING" ]; then
            echo "PROD_DB_CONNECTION_STRING secret is missing."
            exit 1
          fi
        env:
          PROD_DB_CONNECTION_STRING: ${{ secrets.PROD_DB_CONNECTION_STRING }}

      - name: Apply EF Core migrations
        run: >
          dotnet ef database update
          --project eurotrans.server/src/EuroTrans.Infrastructure/EuroTrans.Infrastructure.csproj
          --startup-project eurotrans.server/src/EuroTrans.Api/EuroTrans.Api.csproj
          --configuration Release
          --connection "$PROD_DB_CONNECTION_STRING"
        env:
          PROD_DB_CONNECTION_STRING: ${{ secrets.PROD_DB_CONNECTION_STRING }}

      - name: Publish API
        run: dotnet publish eurotrans.server/src/EuroTrans.Api/EuroTrans.Api.csproj --configuration Release --output ./publish/api --no-build

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "euro-trans"
          slot-name: "Production"
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_5EEA8F3C1C964300BE898AC8B6FEEA84 }}
          package: ./publish/api
