name: Client CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "eurotrans.client/**"
      - ".github/workflows/client-cd.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: eurotrans.client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      # ✅ Install pnpm via Corepack
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      # Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint
      - name: Lint
        run: pnpm lint

      # Build
      - name: Build
        run: pnpm build

      # Ensure Vercel token exists
      - name: Ensure Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN is missing"
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Deploy
      - name: Deploy to Vercel
        run: pnpm exec vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
